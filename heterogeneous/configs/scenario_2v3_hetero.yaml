# ---------------------------------------------------------------------------
# Asymmetric-force variant of scenario_2v2_hetero_train (outnumbered test)
#   red  = F-16A + OV-10 UCAV (the trained two-agent team, unchanged)
#   blue = 2 x F-16A + 1 x OV-10 (mirror composition plus one extra fighter)
# Purpose: zero-shot evaluation of the 2v2-trained policy under numerical
# disadvantage; everything else identical to the training scenario.
# ---------------------------------------------------------------------------

scenario:
  name: hetero_2v3
  task: T1_air_superiority
  physics_hz: 10
  max_steps: 3000                     # 300 s episode cap

  win_conditions:
    annihilation: true

  red:
    formation: spread
    platforms: [f16_fighter, ov10_ucav]
    spawn:
      - [0,    -15000, -3500,  1.5708, 230]
      - [-500, -15700, -3450,  1.5708, 70]
    jitter_m: [300, 200, 100]

  blue:
    formation: wedge
    difficulty: L2                    # overridden by eval job levels
    platforms: [f16_fighter, f16_fighter, ov10_ucav]
    spawn:
      - [0,    15000, -3500, -1.5708, 230]
      - [-600,  15600, -3500, -1.52,  230]
      - [600,  15700, -3450, -1.62,    70]
    jitter_m: [300, 200, 100]

  arena:
    floor_m: 30.0
    ceiling_m: 16000.0
    disengage_range_m: 60000.0
