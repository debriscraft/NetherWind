# ---------------------------------------------------------------------------
# Training variant of scenario_2v2_hetero (Phase 4)
#   * physics_hz 10 (dt=0.1 s): timestep invariance vs 20 Hz was verified
#     in tests/test_dynamics.py (T3), so training at 10 Hz halves wall
#     time without changing the dynamics;
#   * red has NO scripted_level: the red team is agent-controlled;
#   * everything else identical to the evaluation scenario, so policies
#     transfer directly to the 20 Hz evaluation runs.
# ---------------------------------------------------------------------------

scenario:
  name: calib_pm
  task: T1_air_superiority
  physics_hz: 10
  dynamics: pointmass
  max_steps: 3000                     # 300 s episode cap

  win_conditions:
    annihilation: true

  red:
    scripted_level: L2
    formation: spread
    platforms: [f16_fighter, ov10_ucav]
    spawn:
      - [0,    -15000, -3500,  1.5708, 230]
      - [-500, -15700, -3450,  1.5708, 70]
    jitter_m: [300, 200, 100]

  blue:
    formation: wedge
    difficulty: L2                    # default; train script may override
    platforms: [f16_fighter, ov10_ucav]
    spawn:
      - [0,    15000, -3500, -1.5708, 230]
      - [600,  15700, -3450, -1.62,    70]
    jitter_m: [300, 200, 100]

  arena:
    floor_m: 30.0
    ceiling_m: 16000.0
    disengage_range_m: 60000.0
